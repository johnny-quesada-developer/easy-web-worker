[mcp_servers.chrome-devtools]
command = "/usr/local/bin/npx"
args = ["-y", "chrome-devtools-mcp@latest", "--isolated", "--no-usage-statistics", "--no-performance-crux"]
startup_timeout_sec = 60

[mcp_servers.chrome-devtools.env]
PATH = "/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
CHROME_DEVTOOLS_MCP_NO_USAGE_STATISTICS = "1"

[mcp_servers.playwright]
command = "/usr/local/bin/npx"
args = ["-y", "@playwright/mcp@latest", "--browser", "chrome"]
startup_timeout_sec = 60

[mcp_servers.playwright.env]
PATH = "/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
http_headers_helper = "/usr/local/bin/node /Users/johnny/.claude/mcp-helpers/github-headers.cjs"

[mcp_servers.nx]
command = "/usr/local/bin/npx"
args = ["-y", "nx-mcp@latest", "/Users/johnny/Documents/github/personal/easy-web-worker", "--no-minimal", "--disableTelemetry"]
startup_timeout_sec = 60
tool_timeout_sec = 60

[mcp_servers.nx.env]
PATH = "/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
NX_DAEMON = "false"
NX_NO_CLOUD = "true"
